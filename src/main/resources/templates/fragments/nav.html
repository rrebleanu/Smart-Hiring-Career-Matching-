<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav th:fragment="nav">
  <ul>
    <li><a th:href="@{/}">Home</a></li>
    <li sec:authorize="isAnonymous()"><a th:href="@{/login}">Login</a></li>
    <li sec:authorize="isAuthenticated()">
      <form th:action="@{/logout}" method="post" style="display:inline; margin:0;">
        <button type="submit" style="background:none; border:none; color:inherit; cursor:pointer; font:inherit; padding:0;">Logout</button>
      </form>
    </li>
    <li sec:authorize="isAuthenticated()">
      <a th:href="@{/profil}">Profil</a>
    </li>
    <li><a th:href="@{/companii}">Companii</a></li>
    <li><a th:href="@{/anunturi}">Anunturi</a></li>

    <!-- AICI AM ADAUGAT BUTONUL PT TOP JOBURI AI -->
    <li sec:authorize="hasRole('CANDIDAT')">
      <a th:href="@{/candidat/recomandari}" style="color: #28a745; font-weight: bold;">✨ Top Joburi AI</a>
    </li>

    <li><a th:href="@{/despre}">Despre Noi</a></li>
    <li><a th:href="@{/contact}">Contact</a></li>
  </ul>
</nav>
</body>
</html>
